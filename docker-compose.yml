# Start everything:  cp .env.example .env  (add your key)  &&  docker compose up --build
# App: http://localhost:8080      API docs: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data                       # vector index, SQLite registry and uploads live here
      ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5173"
    volumes:
      - studymate_data:/data                # persists across `docker compose down` / restarts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  studymate_data:
